name: Build All Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      # --- ၁။ Tauri App ကို Installer တွေပါ တစ်ခါတည်း Build လုပ်မယ် ---
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- ၂။ Portable Binary ဖိုင်တွေ ထပ်ဆောင်း ဖန်တီးမယ် ---
      
      # Windows (Installer အပြင် Portable .exe)
      - name: Prepare Windows Files
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/release
          # Binary ဖိုင်ကို Portable အနေနဲ့ နာမည်ပြောင်းပြီး ယူမယ်
          if [ -f "du-finder.exe" ]; then
            cp du-finder.exe DupliZero.exe
          fi
          # Portable exe ကို zip ချုံ့မယ်
          if [ -f "DupliZero.exe" ]; then
            tar -a -c -f DupliZero-${{ github.event.inputs.version }}-windows-portable.zip DupliZero.exe
          fi

      # Linux (Installer အပြင် Portable AppImage/Binary)
      - name: Prepare Linux Files
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          # Default ထွက်လာတဲ့ Binary ကို ယူမယ်
          if [ -f "du-finder" ]; then
            cp du-finder duplizero
            tar -czvf DupliZero-linux-portable.tar.gz duplizero
          fi

      # macOS (Installer အပြင် Portable .app)
      - name: Prepare macOS Files
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          if [ -d "DupliZero.app" ]; then
            tar -czvf ../../../DupliZero-macos-portable.tar.gz DupliZero.app
          fi

      # --- ၃။ အကုန်လုံးကို Artifacts အနေနဲ့ တင်မယ် ---
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupliZero-${{ matrix.platform }}-all
          path: |
            # Installers
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            # Portables
            src-tauri/target/release/*.zip
            src-tauri/target/release/*.tar.gz
          if-no-files-found: ignore
          