name: Build Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Portable Archive များ ဖန်တီးခြင်း
      # ==========================================

      # Windows အတွက် Portable .zip ဖန်တီးခြင်း
      - name: Create Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/release
          # du-finder.exe ကို DupliZero.exe လို့ နာမည်ပြောင်းပြီး zip လုပ်မယ် (မရှိရင် ကျော်သွားမယ်)
          if [ -f "du-finder.exe" ]; then
            cp du-finder.exe DupliZero.exe
            tar -a -c -f DupliZero-windows-portable.zip DupliZero.exe
          fi

      # Linux အတွက် Portable .tar.gz ဖန်တီးခြင်း
      - name: Create Portable tar.gz (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          if [ -f "du-finder" ]; then
            cp du-finder duplizero
            tar -czvf DupliZero-linux-portable.tar.gz duplizero
          fi

      # macOS အတွက် Portable .tar.gz ဖန်တီးခြင်း
      - name: Create Portable tar.gz (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          if [ -d "DupliZero.app" ]; then
            tar -czvf ../../../DupliZero-macos-portable.tar.gz DupliZero.app
          fi

      # ==========================================
      # Artifacts များ တင်ခြင်း
      # ==========================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupliZero-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/*.zip
            src-tauri/target/release/*.tar.gz
          if-no-files-found: ignore
